# The free checks on every push and pull request: Biome, tsc, the package boundaries, and the
# tests. No live agent runs here; `bun run eval` stays a local, paid run (docs/testing.md).
# macOS, where awf is built and used: on Linux the temporary directory is /tmp, where the engine's
# sockets also live, and the tests that make projects there are refused as exposing them.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      # The runner is slower than a laptop: the lab tests, which spawn awf, pass 5 s there.
      - run: bun test --timeout 30000
