# Builds site/ and deploys it to agents.wf on every push to main. Not filtered by path: the site
# also reads the help files, examples/ and the agentswf manifest. A failed build deploys nothing.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # each page's "last updated" reads its git history
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
