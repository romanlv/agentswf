# Builds site/ and deploys it to agents.wf when a push to main touches what the build reads:
# site/, the samples in examples/, the CLI help files and AGENTS.md template it includes, and the
# agentswf manifest it takes the version from. A failed build deploys nothing.
name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - examples/**
      - packages/engine/src/help/**
      - packages/engine/src/init-template/AGENTS.md.template
      - packages/agentswf/package.json
      - .github/workflows/site.yml
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # each page's "last updated" reads its git history
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
